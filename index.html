<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet"
    href="style.css"
    media="screen"
    charset="utf-8"
    >
  </head>
  <body>
    <header class="info">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
      <a class="info__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="todo">
      <div class="todo__add">
        <label class="todo__add-label">Add Item</label>
        <div class="todo__add-wrapper">
          <input class="todo__add-input"
          type="text"
          >
          <button class="todo__button todo__add-button">Add</button>
        </div>
      </div>
      <h3 class="todo__title">Todo</h3>
      <ul class="todo__list todo__list_incomplete">
        <li class="todo__item">
          <input type="checkbox" class="todo__check">
          <label class="todo__label">Pay Bills</label>
          <input type="text" class="todo__input">
          <button class="todo__button todo__button_edit">Edit</button>
          <button class="todo__button todo__button_delete">
            <img src="./remove.svg" alt="remove">
          </button>
        </li>
        <li class="todo__item todo__item_edit">
          <input type="checkbox" class="todo__check">
          <label class="todo__label">Go Shopping</label>
          <input type="text"
          value="Go Shopping"
          class="todo__input"
          >
          <button class="todo__button todo__button_edit">Save</button>
          <button class="todo__button todo__button_delete">
            <img src="./remove.svg" alt="remove">
          </button>
        </li>
      </ul>
      <h3 class="todo__title">Completed</h3>
      <ul class="todo__list todo__list_complete">
        <li class="todo__item">
          <input type="checkbox" class="todo__check" checked>
          <label class="todo__label">See the Doctor</label>
          <input type="text" class="todo__input">
          <button class="todo__button todo__button_edit">Edit</button>
          <button class="todo__button todo__button_delete">
            <img src="./remove.svg" alt="remove">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
