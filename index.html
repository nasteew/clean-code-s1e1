<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet"
    href="style.css"
    media="screen"
    charset="utf-8"
    >
  </head>
  <body>
    <div class="info">
      <img src="./eisenhower-matrix.jpg">
      <a class="info-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main-block">
      <p class="add-section">
        <label for="new-task" class="new-task-label">Add Item</label>
        <div class="task-wrapper">
          <input class="new-task task"
          type="text"
          >
          <button class="btn btn-add">Add</button>
        </div>
      </p>
      <h3 class="task-list-title">Todo</h3>
      <ul class="task-list incomplete">
        <li class="task-item">
          <input type="checkbox" class="check-task">
          <label class="task label-task">Pay Bills</label>
          <input type="text" class="task input-task">
          <button class="btn btn-edit">Edit</button>
          <button class="btn btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
        <li class="task-item edit-mode">
          <input type="checkbox" class="check-task">
          <label class="task label-task">Go Shopping</label>
          <input type="text"
          value="Go Shopping"
          class="task input-task"
          >
          <button class="btn btn-edit">Save</button>
          <button class="btn btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3 class="task-list-title">Completed</h3>
      <ul class="task-list complete">
        <li class="task-item">
          <input type="checkbox" class="check-task" checked>
          <label class="task label-task">See the Doctor</label>
          <input type="text" class="task input-task">
          <button class="btn btn-edit">Edit</button>
          <button class="btn btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
